realm: employees
realm_name: Our beautiful Employees
base_url: http://localhost:8080/acme/employees

flows:
  mock:
    route: /mock
    active: yes
    definition_location: mock.yaml

applications:
  oidc-federation-test:
    client_id: oidc-federation-test
    client_secret: oidc-federation-test-secret
    confidential: true
    consent_required: false
    allowed_scopes:
      - openid
      - profile
      - email
    allowed_grants:
      - authorization_code
    redirect_uris:
      - http://integration-test.com/acme/customers/authui/oidc-federation/callback
    allowed_authentication_flows:
      - mock
    access_token_lifetime: 3600
    id_token_lifetime: 3600
