apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goam.fullname" . }}-db-credentials
  labels:
    {{- include "goam.labels" . | nindent 4 }}
type: Opaque
data:
  # The password is base64 encoded by Helm
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  # You might want to encode other values here too
