description: 'Implements a device-based login flow that checks for known devices and creates a mock user if needed'
start: init
nodes:
  init:
    name: init
    use: init
    custom_config: {}
    next:
      start: listAvailableUsers

  listAvailableUsers:
    name: listAvailableUsers
    use: listAvailableUsers
    next:
      success: getLoa
      none: askUserID

  getLoa:
    name: getLoa
    use: getLoa
    next:
      '1': successResult
      '0': askPassword
      'none': askUserID

  askPassword:
    name: askPassword
    use: askPassword
    custom_config:
      message: Your session has expired. Please enter your password to continue.
    next:
      submitted: validatePassword

  validatePassword:
    name: validatePassword
    use: validatePassword
    next:
      success: setLoa1
      fail: askPassword

  setLoa1:
    name: setLoa1
    use: setLoa1
    next:
      success: successResult

  askUserID:
    name: askUserID
    use: askUserID
    custom_config: {}
    next:
      submitted: validatePasswordAtLogin
      not_found: askPasswordForNewUser

  askPasswordForNewUser:
    name: askPasswordForNewUser
    use: askPassword
    custom_config:
      message: User not found. Please choose a password to create your account.
    next:
      submitted: createUser

  validatePasswordAtLogin:
    name: validatePasswordAtLogin
    use: validatePassword
    next:
      success: setLoa1AtLogin
      fail: askUserID

  setLoa1AtLogin:
    name: setLoa1AtLogin
    use: setLoa1
    next:
      success: addKnownDevice

  createUser:
    name: createUser
    use: createUser
    next:
      success: setLoa1AtLogin
      existing: validatePasswordAtLogin

  addKnownDevice:
    name: addKnownDevice
    use: addKnownDevice
    custom_config:
      cookie_name: device
    next:
      success: successResult
      device_already_exists: successResult

  successResult:
    name: successResult
    use: successResult
    custom_config:
      message: Login successful!
    next: {}

