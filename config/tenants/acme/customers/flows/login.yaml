description: 'State-of-the-art login flow with account listing, passkeys, TOTP, and LOA management.'
start: init
nodes:
  init:
    name: init
    use: init
    custom_config: {}
    next:
      start: listAvailableUsers

  listAvailableUsers:
    name: listAvailableUsers
    use: listAvailableUsers
    next:
      success: getLoa
      none: passwordOrSocialLogin

  getLoa:
    name: getLoa
    use: getLoa
    next:
      '2': successResult
      '1': hasTOTP
      '0': askPassword
      'none': passwordOrSocialLogin

  passwordOrSocialLogin:
    name: passwordOrSocialLogin
    use: passwordOrSocialLogin
    custom_config:
      useUsername: false
      useEmail: true
      usePassword: true
      usePasskeys: true
      showForgotPassword: true
      disablePasskeyBtn: false
      showRegistrationLink: false
      title: "Welcome back"
      message: "Please choose a login method"
    next:
      password: validatePassword
      passkey: verifyPasskey
      forgotPassword: forgotPassword_AskEmail

  forgotPassword_AskEmail:
    name: askEmail
    use: askEmail
    next:
      submitted: forgotPassword_EmailOTP

  forgotPassword_EmailOTP:
    name: emailOTP
    use: emailOTP
    next:
      success-registered-email: forgotPassword_HasTOTP
      success-new-email-for-user: forgotPassword_HasTOTP 
      success-unkown-email: forgotPassword_AccountNotFound

  forgotPassword_AccountNotFound:
    name: forgotPassword_AccountNotFound
    use: failureResult
    custom_config:
      message: Please register, account does not exist.
    next: {}

  forgotPassword_HasTOTP:
    name: hasTOTP
    use: hasTOTP
    next:
      yes: forgotPassword_VerifyTOTP
      no: forgotPassword_AskNewPassword

  forgotPassword_VerifyTOTP:
    name: verifyTOTP
    use: verifyTOTP
    next:
      success: forgotPassword_AskNewPassword
      fail: forgotPassword_VerifyTOTP

  forgotPassword_AskNewPassword:
    name: askPassword
    use: askPassword
    custom_config:
      message: Please choose a new password for your account.
    next:
      submitted: forgotPassword_UpdatePassword

  forgotPassword_UpdatePassword:
    name: updatePassword
    use: updatePassword
    next:
      success: forgotPassword_CheckMFAUsed
  
  forgotPassword_CheckMFAUsed:
    name: hasTOTP
    use: hasTOTP
    next:
      yes: setLoa2
      no: setLoa1

  askPassword:
    name: askPassword
    use: askPassword
    custom_config:
      message: Your session has expired. Please enter your password to continue.
    next:
      submitted: validatePassword

  validatePassword:
    name: validatePassword
    use: validatePassword
    next:
      success: setLoa1
      fail: passwordOrSocialLogin

  setLoa1:
    name: setLoa1
    use: setLoa1
    next:
      success: hasTOTP

  hasTOTP:
    name: hasTOTP
    use: hasTOTP
    next:
      yes: verifyTOTP
      no: successResult

  verifyTOTP:
    name: verifyTOTP
    use: verifyTOTP
    next:
      success: setLoa2
      fail: verifyTOTP

  verifyPasskey:
    name: verifyPasskey
    use: verifyPasskey
    next:
      success: setLoa2
      failure: passwordOrSocialLogin

  setLoa2:
    name: setLoa2
    use: setLoa2
    next:
      success: successResult

  successResult:
    name: successResult
    use: successResult
    custom_config:
      message: Login successful!
    next: {}
