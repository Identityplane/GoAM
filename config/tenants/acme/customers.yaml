realm: customers
realm_name: Our beautiful Customers xoxo

realm_settings:
  backgroundColor: "#3F3FF3"
  accentColor: "#3F3FF3"
  logoSvg: ""
  logoName: "Acme"
  privacyPolicyUrl: "/privacy"
  sidebarTitle: "Secure your world."
  sidebarText: "Join Acme to manage your secure identity."
  fontFamily: "Inter, \"Inter Fallback\""
  enable_google: "true"
  enable_apple: "true"
  enable_telegram: "false"
  enable_github: "false"
  enable_passkey: "true"
  primaryButtonColor: "#3F3FF3"
  primaryButtonHoverColor: "#2d2dbd"
  termsOfConditionsUrl: "#"
  enable_tc_terms: "true"
  enable_privacy_terms: "true"
  enable_marketing_terms: "false"
  preselect_tc_terms: "false"
  preselect_privacy_terms: "false"
  preselect_marketing_terms: "false"
  copyrightText: "Copyright © 2025 Acme Security Inc."
  enable_register: "true"
  show_sidebar: "true"
  pageBackgroundColor: "#ffffff"
  inputBackgroundColor: "#f9fafb"

